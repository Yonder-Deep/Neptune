name: Lint, format, build, test

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          subFolder: neptune/
          imageName: ghcr.io/yonder-deep/neptune-devcontainer
          cacheFrom: ghcr.io/yonder-deep/neptune-devcontainer
          push: always
          runCmd: printenv && which cmake && cmake --version && make ci
